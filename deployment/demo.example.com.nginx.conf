# Example only: configure DNS and obtain the TLS certificate before enabling.
server {
  listen 80;
  server_name demo.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name demo.example.com;
  ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:9981;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
