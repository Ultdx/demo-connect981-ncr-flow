services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Loopback publishing allows local Node/Compass access without exposing MongoDB to the LAN.
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { if (rs.status().myState !== 1) quit(1); }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); }"
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DEMO_USERNAME: ${DEMO_USERNAME:?Set DEMO_USERNAME in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      MONGO_URI: ${DOCKER_MONGO_URI:?Set DOCKER_MONGO_URI in .env}
      PORT: 4000
      SEED_ON_START: 'true'
      STALE_NCR_DAYS: ${STALE_NCR_DAYS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GRAPHIQL: 'false'
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    depends_on: { mongo: { condition: service_healthy } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['127.0.0.1:8080:80']
    depends_on: { api: { condition: service_healthy } }
volumes:
  mongo-data:
